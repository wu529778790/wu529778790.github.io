<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" width="100%" role="img">
<title>Tool Calling 调用机制</title>
<desc>调用 API 时传入工具清单，模型生成 tool_calls，代码执行工具后回传，循环直到模型直接回答</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect x="190" y="20" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">调用大模型 API</text>
<text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">messages + 工具清单（我们提供）</text>
</g>

<g>
<rect x="190" y="136" width="300" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">模型返回 AIMessage</text>
<text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">tool_calls 是模型"生成"的</text>
</g>

<g>
<rect x="190" y="252" width="300" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="270" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">我们执行工具函数</text>
<text x="340" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">真正干活的是我们的代码</text>
</g>

<g>
<rect x="190" y="368" width="300" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="386" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">ToolMessage 回传结果</text>
<text x="340" y="404" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">tool_call_id 关联对应工具调用</text>
</g>

<g>
<rect x="190" y="484" width="300" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="502" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">模型最终回答</text>
<text x="340" y="520" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">没有 tool_calls，循环结束</text>
</g>

<path d="M340 76 L340 136" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 192 L340 252" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 308 L340 368" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 424 L340 484" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M190 396 C 140 396, 140 164, 190 164" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="272" font-size="12" fill="#5F5E5A">循环执行</text>
<text x="40" y="288" font-size="12" fill="#5F5E5A">直到没有 tool_calls</text>

<rect x="215" y="556" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="231" y="561" font-size="12" fill="#444441">我们（开发者）写的代码</text>
<rect x="385" y="556" width="10" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="401" y="561" font-size="12" fill="#444441">模型生成的内容</text>
</svg>